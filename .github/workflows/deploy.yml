name: Build and Deploy

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  # 每次 push：内容校验 + 构建验证（不部署）
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Validate content
        run: npm run check

      - name: Build site
        run: npm run build

  # 打 v* 标签或手动触发：部署到 Cloudflare Pages 并记录发布历史到 D1
  # 需在仓库 Secrets 配置 CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    # Cloudflare 资源未就绪前：push main 只构建验证，打 v* 标签或手动触发才部署
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Set metadata
        id: meta
        shell: bash
        run: |
          echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="build-${GITHUB_RUN_NUMBER}"
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Ensure Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # 新版 wrangler 不再在 deploy 时自动建项目；已存在时创建会报错，忽略之
        run: npx wrangler pages project create my-creative-site --production-branch=main || echo "project may already exist, continue"

      - name: Deploy to Cloudflare Pages
        id: pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=my-creative-site --branch=main

      - name: Generate content index SQL
        run: node scripts/sync-content-db.mjs > contents.sql

      - name: Sync content index to D1
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 execute creative-site-db --remote --file=contents.sql

      - name: Record deployment to D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node scripts/record-deployment.mjs \
            "${{ steps.meta.outputs.version }}" \
            "${{ steps.meta.outputs.sha }}" \
            "${{ steps.pages.outputs.deployment-url }}" \
            "${{ github.actor }}"
